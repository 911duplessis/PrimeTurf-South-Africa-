<!doctype html><html><head><meta charset="utf-8">
<!-- Social share image source (brand system). Render: serve _site, copy this file into it, screenshot at 1200×630 → src/assets/img/og/og-default.jpg -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Montserrat:wght@600&display=block">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FAF8F2;position:relative;font-family:Montserrat,Arial,sans-serif}
.l{position:absolute;left:0;top:0;bottom:0;width:640px;padding:72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.l img{width:340px}
.t{font-family:Cinzel,Georgia,serif;font-size:52px;line-height:1.12;letter-spacing:.02em;color:#1A3A2A;margin:0}
.t span{display:block;color:#1A5A28}
.rule{width:56px;height:1px;background:#B8902A;margin:28px 0 22px}
.m{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#1A3A2A}
.r{position:absolute;right:0;top:0;bottom:0;width:560px}
canvas{position:absolute;inset:0}
.scrim{position:absolute;inset:0;background:linear-gradient(20deg,rgba(26,58,42,.55),rgba(26,58,42,.1))}
</style></head><body>
<div class="r"><canvas id="c" width="560" height="630"></canvas><div class="scrim"></div></div>
<div class="l"><img src="/assets/img/brand/primeturf-horizontal-logo.png" alt="">
<div><p class="t">Always green.<span>Never watered.</span></p><div class="rule"></div>
<div class="m">Artificial turf · Gauteng &amp; Western Cape</div></div></div>
<script type="module">import{paintTurf}from"/assets/js/lib/turf.js";paintTurf(document.getElementById("c").getContext("2d"),560,630,"lush",{seed:4,scale:1.2,horizon:.45});document.body.dataset.ready=1;</script>
</body></html>
