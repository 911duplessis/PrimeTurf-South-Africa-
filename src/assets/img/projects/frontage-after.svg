    <feColorMatrix type="matrix" values="0.32 0 0 0 0.07  0.52 0 0 0 0.24  0.22 0 0 0 0.05  0 0 0 0 1"/>
  </filter>
  <filter id="dry" x="0" y="0" width="100%" height="100%">
